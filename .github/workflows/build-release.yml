name: Build & Release Applications

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Executable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: StealthClickerPro-Windows-x64.exe
            build_file: dist/StealthClickerPro.exe
          - os: ubuntu-latest
            artifact_name: StealthClickerPro-Linux-x64.tar.gz
            build_file: StealthClickerPro-Linux-x64.tar.gz

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xdotool

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Executable
        run: |
          python build_app.py

      - name: Package Linux Artifacts
        if: runner.os == 'Linux'
        run: |
          tar -czvf StealthClickerPro-Linux-x64.tar.gz -C dist StealthClickerPro install_linux.sh assets

      - name: Rename Windows Executable
        if: runner.os == 'Windows'
        run: |
          Copy-Item dist/StealthClickerPro.exe -Destination StealthClickerPro-Windows-x64.exe

      - name: Upload Build Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
